server:
  port: 8081

spring:
  application:
    name: ingestion-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Health only, never with details (an unauthenticated probe should learn
# "UP", not our bootstrap servers). Liveness is what ECS's container health
# check hits: livenessState alone - "is this process still serving?" - so a
# broker outage cannot get every task killed and replaced into the same
# outage. Readiness adds the Kafka probe: a source that asks it learns
# whether a POST would be accepted (202) or refused (503) right now.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,kafkaCluster

audit:
  metrics:
    # Meters stay in-process. The aws profile exports them to CloudWatch.
    cloudwatch:
      enabled: false
  health:
    # One describeCluster round trip per readiness probe, bounded so a
    # hung broker turns into DOWN, not a hung probe.
    kafka-timeout: 3s
  ingestion:
    topic: audit-events
    # Declared on startup with this retention (MSK Serverless retention is
    # per topic, so this is the policy). Enrichment consumes within seconds;
    # a week is replay headroom for an enrichment outage, not storage.
    topic-partitions: 6
    topic-retention: 7d
    # How long a POST waits for the broker to acknowledge before answering
    # 503 (the caller retries). Bounded so a Kafka outage fails fast.
    ack-timeout: 10s
    delivery-timeout: 10s
    # Tokens every event source must present as X-Audit-Token, each bound to
    # the one customer it may write as: "tenant=token,tenant=token". A token
    # that authenticates but authorises nothing lets any source forge any
    # customer's audit trail, which is the one thing an audit trail may not
    # allow - so the tenant half is not optional.
    # Empty = open, for local development only.
    tokens: ${AUDIT_INGESTION_TOKENS:}
    # Per source IP: sources are few and chatty (one POST per event), so
    # generous - the point is one runaway source cannot starve the rest.
    rate-limit:
      enabled: true
      requests-per-second: 200
      burst: 500
      max-tracked-sources: 1000
      # See the gateway's comment: only set this to a header a proxy you
      # control overwrites. Nothing proxies to ingestion today.
      client-ip-header: ""
