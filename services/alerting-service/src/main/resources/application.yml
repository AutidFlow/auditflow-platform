server:
  port: 8083

spring:
  application:
    name: alerting-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: alerting-service
  datasource:
    # Same Aurora as enrichment: alert_rules is where rules live (the file
    # below is synced into it) and alert_history records every alert.
    url: ${AURORA_JDBC_URL:jdbc:postgresql://localhost:5432/auditflow}
    username: ${AURORA_USERNAME:auditflow}
    password: ${AURORA_PASSWORD:auditflow}
  # Flyway, not spring.sql.init. Three services run the same migrations
  # against the same database and used to race on CREATE TABLE IF NOT
  # EXISTS during a compose start or a rolling deploy; Flyway takes a
  # Postgres advisory lock, so whichever gets there first applies and the
  # others wait. It also means a version is applied exactly once, so
  # migrations no longer have to be written to survive being re-run.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # An existing dev database created by the old startup script already has
    # the V1 tables. Baselining stamps it as "V1 applied" instead of failing
    # on a non-empty schema; a fresh database runs V1 normally.
    baseline-on-migrate: true
    baseline-version: 1

# Health only, never with details (an unauthenticated probe should learn
# "UP", not our bootstrap servers or datasource URL). Two groups, two
# questions:
#   liveness  - what ECS's container health check hits. livenessState plus
#               the listener containers: a stopped consumer is a zombie JVM
#               and a restart is the cure. Deliberately NOT Kafka or Aurora
#               reachability - a dependency outage must not get every task
#               killed and replaced into the same outage.
#   readiness - is this instance able to do its job right now: Kafka
#               reachable, database reachable. For humans and alarms.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,kafkaListeners
        readiness:
          include: readinessState,kafkaCluster,db

audit:
  metrics:
    # Meters stay in-process. The aws profile exports them to CloudWatch.
    cloudwatch:
      enabled: false
  health:
    # One describeCluster round trip per readiness probe, bounded so a
    # hung broker turns into DOWN, not a hung probe.
    kafka-timeout: 3s
  alerting:
    # Where enrichment-service republishes enriched events.
    enriched-topic: audit-events-enriched
    # Seed: a JSON array of AlertRule objects (see rules.example.json),
    # inserted into alert_rules on startup for any customer that has no
    # rules yet, and never re-applied after that - so an edit or a delete
    # made through the API is not undone by the next deploy. The table is
    # what alerting matches against; manage rules through the gateway's
    # /api/v1/alert-rules.
    rules-file: ${ALERT_RULES_FILE:classpath:rules.example.json}
    # How often the in-memory rule set is reloaded from alert_rules
    # (ISO-8601 duration: @Scheduled does not accept the "30s" shorthand).
    rules-refresh: PT30S
    slack:
      # Incoming-webhook URL. Blank = log only (dev default). A secret -
      # inject from the environment, never commit it.
      webhook-url: ${ALERT_SLACK_WEBHOOK_URL:}
    email:
      # SES sender (must be verified in SES) and recipients. Blank sender =
      # log only (dev default).
      from: ${ALERT_EMAIL_FROM:}
      to: ${ALERT_EMAIL_TO:}
      region: ${AWS_REGION:us-east-1}
